  - id: changdeokgung
    name: Changdeokgung Palace & Secret Garden
    coordinates:
      - 126.9910
      - 37.5794
    description: UNESCO World Heritage palace with guided Secret Garden tours through centuries-old royal gardens.
    category: culture
    image: "https://images.unsplash.com/photo-1677697087635-bc9771a28c98?w=800"
    url: https://english.cha.go.kr/html/HtmlPage.do?pg=%2Froyal%2FRoyalPalaces_infomation_1.jsp&mn=EN_02_03_02
    hours: "09:00–18:30 (Jun–Aug), closed Mondays. Secret Garden tours 10:30/11:30/14:30/15:30"
